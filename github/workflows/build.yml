name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: List files
        run: ls -R | head -n 200
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build REAL APK
        run: |
          cd GRIDSMESHLINK_APK
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
        ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GridsMeshLink-REAL-APK
          path: GRIDSMESHLINK_APK/app/build/outputs/apk/debug/app-debug.apk
